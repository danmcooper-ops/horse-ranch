apply plugin: 'application'

dependencies {
    implementation project(':core')
    implementation "com.badlogicgames.gdx:gdx-backend-lwjgl3:$gdxVersion"
    implementation "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
}

application {
    mainClass = 'com.ranchgame.lwjgl3.Lwjgl3Launcher'
}

// Self-contained runnable jar (game code + deps + assets) for the .app launcher
tasks.register('gameJar', Jar) {
    group = 'build'
    archiveBaseName = 'HorseRanch'
    manifest {
        attributes 'Main-Class': 'com.ranchgame.lwjgl3.Lwjgl3Launcher'
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from sourceSets.main.output
    from rootProject.file('assets')
    from(configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }) {
        exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
    }
}

tasks.named('run') {
    workingDir = rootProject.file('assets')
    setIgnoreExitValue(true)
    // macOS GLFW requirement is handled by StartupHelper, but keep this as a fallback
    if (org.gradle.internal.os.OperatingSystem.current().isMacOsX()) {
        jvmArgs += ['-XstartOnFirstThread']
    }
}
